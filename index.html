<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="app-version" content="2-gesture">
<meta name="googlebot" content="noindex, nofollow">
<title>Lesson Idea Magazine</title>
<meta name="description" content="A cozy flip-through magazine of first-grade lesson ideas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lesson Ideas">
<meta name="application-name" content="Lesson Ideas">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2d2a32; --ink2:#5d5866; --paper:#fffdf7; --desk:#f5ecdc; --hdr:#ffffff;
  --radius:18px;
  --font-h:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Avenir Next',system-ui,sans-serif;
  --font-hand:'Patrick Hand','Chalkboard SE','Comic Sans MS',cursive;
  --c:#F2545B; --cd:#c23b42; --tint:#FFE5E6; --on:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--hdr);color:var(--ink);font-family:var(--font-h);overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar (solid) ---------- */
.topbar{flex:none;background:var(--hdr);position:relative;z-index:30;
  padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.topbar-inner{height:58px;display:flex;align-items:center;gap:8px}
.crayon-stripe{flex:none;height:7px;position:relative;z-index:29;
  background:repeating-linear-gradient(90deg,#F2545B 0 48px,#F7882F 48px 96px,#E9B200 96px 144px,#22B07D 144px 192px,#14A9C2 192px 240px,#3D8BF2 240px 288px,#9B5DE5 288px 336px,#F15BB5 336px 384px)}
.tb-btn{min-width:46px;height:46px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;
  background:#f6f1e7;font-weight:600;font-size:16px;color:var(--ink);transition:transform .12s,background .2s}
.tb-btn:active{transform:scale(.94)}
.tb-btn svg{width:24px;height:24px}
.tb-btn.home{background:var(--tint);color:var(--cd)}
.tb-title{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:19px}
.tb-title span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--tint)}
@media (max-width:560px){ .tb-btn .lbl{display:none} .tb-title{font-size:17px} }

/* ---------- Desk & book ---------- */
.desk{flex:1;position:relative;overflow:hidden;background-color:var(--desk);
  background-image:radial-gradient(rgba(150,110,60,.10) 1.2px,transparent 1.6px);background-size:18px 18px}
.book{position:absolute;inset:14px 16px 14px 16px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (max-width:600px){ .book{inset:8px 8px 8px 8px} }
.view{position:absolute;inset:0;display:flex;border-radius:var(--radius);overflow:hidden;background:var(--paper);
  box-shadow:0 12px 30px rgba(80,50,10,.18),0 2px 0 rgba(80,50,10,.08);transform:translateZ(0)}
.view.enter{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:scale(.965) translateY(8px)}to{opacity:1;transform:none}}
.view.spread::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:70px;transform:translateX(-50%);pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(60,40,10,.07) 40%,rgba(60,40,10,.18) 50%,rgba(60,40,10,.07) 60%,transparent)}
.page{position:relative;flex:1 1 0;min-width:0;height:100%;overflow:hidden;container-type:inline-size}
.page-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page-scroll::-webkit-scrollbar{width:0;height:0}
.page img{-webkit-user-drag:none;user-select:none}

/* ---------- Flip machinery ---------- */
.flip{position:absolute;inset:0;z-index:6;pointer-events:none;perspective:2200px;perspective-origin:50% 50%}
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;transform:translateZ(0)}
.half.hl{left:0;border-radius:var(--radius) 0 0 var(--radius)}
.half.hr{left:50%;border-radius:0 var(--radius) var(--radius) 0}
.half-inner{position:absolute;top:0;bottom:0}
.half-inner>.view{box-shadow:none;animation:none}
.shade{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:4}
.flipper{position:absolute;top:0;bottom:0;width:50%;will-change:transform;z-index:5}
.flipper.fr{left:50%;transform-origin:0 50%}
.flipper.fl{left:0;transform-origin:100% 50%}
.flipper>.half{left:0;width:100%}
.flipper>.half.back{transform:rotateY(180deg)}
.flip-shadow{position:absolute;top:0;bottom:0;width:50%;pointer-events:none;z-index:4;opacity:0}

/* ---------- Bottom bar (solid) ---------- */
.bottombar{flex:none;background:var(--hdr);border-top:2px solid #f0e6d3;position:relative;z-index:30;
  padding:0 max(12px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px,env(safe-area-inset-left))}
.bottombar-inner{height:58px;display:flex;align-items:center;gap:12px}
.pg-btn{width:56px;height:44px;border-radius:14px;background:var(--tint);color:var(--cd);display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .2s}
.pg-btn:active{transform:scale(.92)}
.pg-btn[disabled]{opacity:.35;cursor:default}
.pg-btn svg{width:26px;height:26px}
.pg-mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.pg-text{font-size:15px;font-weight:500;color:var(--ink2)}
.pg-track{width:min(320px,100%);height:9px;border-radius:9px;background:#f1eadd;overflow:hidden;position:relative}
.pg-fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--c);transition:width .35s ease;
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)}

/* ---------- FAB ---------- */
.fab{position:absolute;right:max(26px,env(safe-area-inset-right));bottom:24px;z-index:20;width:70px;height:70px;border-radius:50%;
  background:#F2545B;color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 0 #c23b42,0 12px 22px rgba(194,59,66,.35);transition:transform .15s}
.fab svg{width:36px;height:36px}
.fab:active{transform:translateY(4px);box-shadow:0 2px 0 #c23b42,0 6px 12px rgba(194,59,66,.3)}
.fab::after{content:"";position:absolute;top:9px;left:16px;width:16px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-30deg)}
@media (max-width:600px){ .fab{width:62px;height:62px;right:18px;bottom:18px} }

/* ---------- Shared bits ---------- */
.hand{font-family:var(--font-hand)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 13px;border-radius:999px;font-weight:500;font-size:15px;
  background:#fff;border:2px solid var(--tc,#ccc);color:var(--ink);transition:transform .1s,background .15s}
.chip:active{transform:scale(.95)}
.chip .hash{color:var(--tc,#999);font-weight:700}
.chip[aria-pressed="true"]{background:var(--tc);color:#fff}
.chip[aria-pressed="true"] .hash{color:#fff}
.tape{position:absolute;width:86px;height:24px;background:rgba(255,236,150,.75);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.clip{position:absolute;width:26px;height:64px}
.btn{min-height:48px;padding:0 20px;border-radius:16px;font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:#f3ede2;color:var(--ink);box-shadow:0 4px 0 rgba(90,70,40,.18);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,70,40,.18)}
.btn svg{width:22px;height:22px}
.btn.primary{background:#22B07D;color:#fff;box-shadow:0 4px 0 #168059}
.btn.blue{background:#3D8BF2;color:#fff;box-shadow:0 4px 0 #2765bb}
.btn.colored{background:var(--c);color:var(--on);box-shadow:0 4px 0 var(--cd)}
.btn.danger{background:#fff;color:#d23c3c;box-shadow:0 0 0 2px #f4b9b9 inset,0 4px 0 rgba(210,60,60,.18)}
.btn.ghost{background:#fff;box-shadow:0 0 0 2px #eadfca inset,0 4px 0 rgba(90,70,40,.12)}

/* ---------- TOC ---------- */
.toc{background-color:#fffbf2;background-image:radial-gradient(#ecdfc6 1.3px,transparent 1.6px);background-size:22px 22px}
.toc .page-scroll{padding:18px clamp(14px,3.2cqw,38px) 110px}
.chalkboard{position:relative;background:#2f5d50;color:#fbfaf3;border:12px solid #c08a4f;border-radius:16px;
  box-shadow:inset 0 0 50px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.15),0 5px 0 #8f5f2c,0 12px 20px rgba(80,50,10,.18);
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.08),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(255,255,255,.05),transparent 50%)}
.toc-head{text-align:center;padding:16px 18px 30px;margin:4px 6px 0}
.toc-head .kick{font-family:var(--font-hand);font-size:clamp(20px,3.4cqw,28px);opacity:.9;letter-spacing:.5px}
.toc-head h1{margin:2px 0 0;font-weight:600;font-size:clamp(30px,6.4cqw,58px);line-height:1.02;letter-spacing:.5px;text-shadow:0 0 2px rgba(255,255,255,.5),0 0 12px rgba(255,255,255,.15)}
.toc-head .sub{font-family:var(--font-hand);font-size:clamp(17px,2.6cqw,22px);margin-top:6px;opacity:.85}
.toc-head .chalk-doodle{position:absolute;opacity:.8}
.ledge{position:absolute;left:-12px;right:-12px;bottom:-22px;height:14px;background:#a8743d;border-radius:4px;box-shadow:0 3px 0 #7d5226}
.ledge .crayon{position:absolute;bottom:12px}
.toc-intro{display:flex;align-items:center;justify-content:center;gap:10px;margin:34px 0 4px;font-family:var(--font-hand);font-size:clamp(20px,3cqw,25px);color:var(--ink2);text-align:center}
.toc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2.2cqw,24px);margin-top:16px}
.toc-row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.2cqw,24px);margin-top:clamp(18px,2.6cqw,28px)}
@container (max-width:640px){ .toc-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@container (max-width:460px){ .toc-row2{grid-template-columns:1fr} }
.tile{position:relative;background:var(--tint);border:3px solid var(--c);border-radius:24px;padding:18px 10px 14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:158px;text-align:center;
  box-shadow:0 6px 0 var(--cd),0 10px 18px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s;rotate:-1.2deg}
.tile:nth-child(even){rotate:1.1deg}
.tile:nth-child(3n){rotate:-.4deg}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.tile .ic{width:clamp(62px,9cqw,84px);height:clamp(62px,9cqw,84px);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,255,255,.6)}
.tile .ic svg{width:78%;height:78%}
.tile .nm{font-weight:600;font-size:clamp(16px,2.3cqw,20px);line-height:1.12;color:var(--ink)}
.tile .ct{font-size:13px;font-weight:600;color:var(--cd);background:#fff;border-radius:999px;padding:2px 10px}
.tile .tape{top:-12px;left:50%;margin-left:-43px;rotate:-4deg}
.tile:nth-child(even) .tape{rotate:5deg;background-color:rgba(190,230,255,.75)}
.tile.wide{flex-direction:row;justify-content:flex-start;min-height:96px;padding:12px 16px;gap:14px;text-align:left}
.tile.wide .ic{width:62px;height:62px;flex:none}
.tile.wide .tx{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.toc-foot{display:flex;justify-content:center;gap:16px;margin-top:30px;opacity:.95;flex-wrap:wrap}

/* ---------- Cover ---------- */
.cover{background-color:var(--c);color:var(--on);
  background-image:radial-gradient(rgba(255,255,255,.2) 2.2px,transparent 2.8px),radial-gradient(rgba(255,255,255,.12) 2px,transparent 2.6px);
  background-size:34px 34px,34px 34px;background-position:0 0,17px 17px}
.cover .page-scroll{display:flex;flex-direction:column;align-items:center;padding:28px 22px 110px;text-align:center}
.cover .page-scroll>:first-child{margin-top:auto}.cover .page-scroll>:last-child{margin-bottom:auto}
.cover-card{position:relative;background:#fffdf7;color:var(--ink);border-radius:10px;padding:26px clamp(18px,5cqw,42px) 24px;width:min(560px,100%);rotate:-1.6deg;
  box-shadow:0 10px 0 rgba(0,0,0,.12),0 20px 40px rgba(0,0,0,.15);
  background-image:linear-gradient(90deg,transparent 36px,#f6a5a5 36px,#f6a5a5 38px,transparent 38px),linear-gradient(#fffdf7 33px,#d9e8f8 33px,#d9e8f8 34px);
  background-size:100% 100%,100% 34px}
.cover-card .clip{top:-26px;right:34px;rotate:8deg}
.cover-kick{font-family:var(--font-hand);font-size:22px;color:var(--cd);letter-spacing:3px;text-transform:uppercase}
.cover-title{margin:2px 0 4px;font-size:clamp(34px,8cqw,64px);line-height:1.02;font-weight:700;color:var(--c);text-shadow:3px 3px 0 var(--tint)}
.cover-tag{font-family:var(--font-hand);font-size:clamp(20px,3.6cqw,26px);color:var(--ink2)}
.cover-art{position:relative;width:min(56cqw,300px);aspect-ratio:1;margin:clamp(26px,5cqh,46px) 0 18px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(255,255,255,.35),0 0 0 26px rgba(255,255,255,.15);animation:float 4s ease-in-out infinite}
.cover-art svg{width:70%;height:70%}
.cover-art .star{position:absolute;width:56px;height:56px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.cover-count{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--cd);border-radius:999px;padding:8px 18px;font-weight:600;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.cover-hint{margin-top:22px;display:flex;align-items:center;gap:10px;font-family:var(--font-hand);font-size:22px;color:var(--on);opacity:.95}
.cover-hint svg{width:30px;height:30px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}
.cover-actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.cover .btn.ghost{background:rgba(255,255,255,.95)}

/* ---------- Lesson page ---------- */
.lesson{background:#fffef9}
.lesson::after{content:"";position:absolute;left:12px;top:0;bottom:0;width:22px;pointer-events:none;
  background:radial-gradient(circle at 11px 50%,#e9e0cf 8px,rgba(0,0,0,.08) 9px,transparent 10px) 0 0/22px 33.33% repeat-y;opacity:.9}
.sheet{position:relative;min-height:100%;padding:20px clamp(16px,4cqw,30px) 130px 72px;
  background-image:linear-gradient(90deg,transparent 54px,#f4a3a3 54px,#f4a3a3 56px,transparent 56px),linear-gradient(transparent 31px,#d8e7f7 31px,#d8e7f7 32px);
  background-size:100% 100%,100% 32px;background-position:0 0,0 6px}
@container (max-width:440px){
  .sheet{padding-left:46px;padding-right:14px;background-image:linear-gradient(90deg,transparent 34px,#f4a3a3 34px,#f4a3a3 36px,transparent 36px),linear-gradient(transparent 31px,#d8e7f7 31px,#d8e7f7 32px)}
  .lesson::after{display:none}
}
.ls-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sec-pill{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:var(--on);border-radius:999px;padding:4px 13px 4px 6px;font-weight:600;font-size:14px;min-height:34px}
.sec-pill i{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.sec-pill i svg{width:20px;height:20px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:5px 10px;min-height:30px}
.badge.mine{background:#ffd6e8;color:#b0306f;rotate:3deg;box-shadow:2px 3px 0 rgba(176,48,111,.18);border-radius:3px}
.badge.mine svg{width:15px;height:15px}
.badge.starter{border:2px dashed #b9ad95;color:#8a7f69;border-radius:8px;background:rgba(255,255,255,.7);rotate:-2deg}
.badge.edited{color:#8a7f69;font-weight:500}
.ls-spacer{flex:1}
.ic-btn{width:48px;height:48px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 0 0 2px #efe5d2 inset,0 3px 0 rgba(0,0,0,.06);transition:transform .12s}
.ic-btn:active{transform:scale(.9)}
.ic-btn svg{width:28px;height:28px}
.ic-btn.fav[aria-pressed="true"]{background:#fff6d6;box-shadow:0 0 0 2px #ffd65c inset}
.ic-btn.fav[aria-pressed="true"] svg{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3) rotate(12deg)}}
.ls-title{margin:6px 0 14px;font-size:clamp(27px,5.4cqw,40px);line-height:1.12;font-weight:700;color:var(--ink)}
.ls-title span{background:linear-gradient(transparent 58%,var(--tint) 58%,var(--tint) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sticky{position:relative;background:#fff59d;padding:18px 18px 16px;font-family:var(--font-hand);font-size:clamp(20px,3.4cqw,23px);line-height:1.35;
  box-shadow:0 1px 1px rgba(0,0,0,.08),4px 8px 14px rgba(0,0,0,.1);border-radius:2px 2px 18px 2px;rotate:-.8deg;margin:6px 4px 22px}
.sticky .tape{top:-12px;left:50%;margin-left:-43px;rotate:-3deg}
.sticky.pink{background:#ffd3e6;rotate:.9deg}
.sticky.blue{background:#cfe9ff}
.sticky .clip{top:-22px;right:18px}
.sticky b{font-family:var(--font-h);font-weight:600;font-size:16px;display:block;margin-bottom:2px}
.blk{margin:6px 0 18px}
.blk h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:21px;font-weight:600;color:var(--cd)}
.blk h3 svg{width:28px;height:28px}
.mats{list-style:none;margin:0;padding:0;font-family:var(--font-hand);font-size:clamp(20px,3.3cqw,22px);line-height:32px}
.mats li{position:relative;padding-left:36px}
.mats li::before{content:"";position:absolute;left:2px;top:11px;width:24px;height:11px;background:var(--mc,var(--c));
  clip-path:polygon(0 50%,28% 0,100% 0,100% 100%,28% 100%);border-radius:0 3px 3px 0}
.mats li:nth-child(5n+2)::before{--mc:#F7882F}.mats li:nth-child(5n+3)::before{--mc:#22B07D}.mats li:nth-child(5n+4)::before{--mc:#9B5DE5}.mats li:nth-child(5n+5)::before{--mc:#3D8BF2}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;font-family:var(--font-hand);font-size:clamp(20px,3.3cqw,22px);line-height:1.42}
.steps li{position:relative;padding:4px 0 10px 46px;counter-increment:st;min-height:42px}
.steps li::before{content:counter(st);position:absolute;left:0;top:2px;width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--on);
  font-family:var(--font-h);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--cd)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.polaroid{position:relative;background:#fff;padding:10px 10px 12px;margin:18px auto 24px;width:min(100%,420px);rotate:1.8deg;box-shadow:0 2px 3px rgba(0,0,0,.1),4px 12px 22px rgba(0,0,0,.14)}
.polaroid img{display:block;width:100%;max-height:340px;object-fit:cover;background:#eee}
.polaroid .tape{top:-12px;left:50%;margin-left:-43px;rotate:-6deg;background-color:rgba(255,190,220,.75)}

<script>
(()=>{'use strict';
const SEED_VERSION = 1;
const STARTER_RAW = [];
function L(section,title,summary,materials,steps,notes,tags){STARTER_RAW.push({section,title,summary,materials:materials.split(';').map(s=>s.trim()),steps:steps.split('|').map(s=>s.trim()),notes,tags:tags.split(',').map(s=>s.trim())});}

/* ---------------- MATH ---------------- */
L('math','Number Line Hop',
 'Kids become the counters! Students hop forward and back on a giant floor number line to act out addition and subtraction stories within 20.',
 "Painter's tape;Index cards numbered 0–20;Story problem cards;Mini whiteboards & markers",
 'Tape a long line on the floor and lay number cards 0–20 in order.|Read a story problem: "Sam had 7 stickers and got 4 more."|A student stands on 7 and hops forward 4 while the class counts on aloud: "8, 9, 10, 11!"|Everyone writes the matching number sentence (7 + 4 = 11) on whiteboards.|Switch to "take away" stories and hop backward.|Let students invent their own story problems for a friend to hop.',
 'Perfect for wiggly days. Extend by hopping by 2s, or by starting on the bigger number to practice counting on (1.OA.C.5).',
 'Whole Group,Hands-on,Brain Break');
L('math','Make 10 Go Fish',
 'A twist on Go Fish where partners hunt for two cards that make ten — great for building fluency with ten-facts.',
 'Decks of cards (face cards removed; Ace = 1);Ten-frame mats;Two-color counters',
 'Model with a ten-frame: "I have 6. How many more do I need to make 10?"|Deal 5 cards to each player and spread the rest face-down as the "pond."|On your turn, ask a partner for the card that makes 10 with one in your hand: "Do you have a 4?"|If they don\'t, they say "Go fish!" and you draw.|Lay down each pair and say the fact aloud: "6 + 4 = 10!"|The player with the most pairs when the pond is empty wins.',
 'Leave ten-frames out for friends who still need the visual. Works great as a math center once modeled (1.OA.C.6).',
 'Centers,Small Group');
L('math','Paper Clip Measuring',
 'How long is it? Students measure classroom objects with paper clips to learn non-standard measurement — no gaps and no overlaps!',
 'Jumbo paper clips (some linked into chains);Recording sheet;Objects to measure: pencil, glue stick, crayon box, book, shoe',
 'Show a pencil measured the wrong way (with gaps and overlaps). Ask: "What went wrong?"|Model lining up clips end-to-end starting at the very edge.|Partners estimate first, then measure 5 objects and record.|Put the objects in order from shortest to longest.|Share: "Did anything measure exactly the same?"',
 'Next day, measure the same objects with cubes and talk about why the numbers changed (1.MD.A.2).',
 'Hands-on,Centers,Small Group');
L('math','100 Things Collections',
 'Families send in 100 small objects; students sort them into groups of ten and count by tens to 100.',
 'Zip bags with a family note;10-cup sorting mats or ten-frames;Hundreds chart;Recording sheet',
 'A week ahead, send home a note asking for 100 small items (cereal, buttons, pom-poms, LEGO).|On 100th Day, students sort their items into 10 groups of 10.|Count together by tens: 10, 20, 30… 100!|Double-check by coloring a hundreds chart while counting by ones.|Do a gallery walk: why do some collections look bigger even though they are all 100?',
 'Keep a few extra collections ready for anyone who forgets.',
 '100th Day,Hands-on,Whole Group');
L('math','Pumpkin Investigation',
 'A hands-on pumpkin day: estimate, measure, test sink or float, and count the seeds by tens.',
 'One small pumpkin per group;Yarn & scissors;Scale;Tub of water;Cups & paper towels;Pumpkin recording booklet',
 'Estimate how big around the pumpkin is by cutting a piece of yarn. Wrap it around to check who was close!|Weigh the pumpkin and compare it to classroom objects.|Predict: sink or float? Test it in the tub (it floats!).|Scoop the seeds and count them by putting 10 in each cup.|Write one sentence about something surprising.',
 'Messy but memorable! Cut the tops off ahead of time. Pumpkins float because they are hollow inside.',
 'Fall,Halloween,Hands-on,Small Group');
L('math','Shape Monster Builders',
 'Students compose new shapes with pattern blocks, then design a friendly "shape monster" and count its sides and corners.',
 'Pattern blocks;Paper shape cutouts;Glue sticks;Construction paper;Googly eyes (optional)',
 'Review shape names, sides, and vertices (corners).|Challenge: build a hexagon out of other blocks. How many ways can you find?|Students glue paper shapes together to build a monster.|Fill in: "My monster has __ triangles and __ squares."|Partners count the total number of sides on each other\'s monsters.',
 'Covers 1.G.A.1–2. Hallway display idea: "Shape Monsters Ate Our Hallway!"',
 'Hands-on,Centers,Halloween');

/* ---------------- LITERACY ---------------- */
L('literacy','Sight Word Swat',
 'Two players race to swat the sight word that is called — quick, active practice with high-frequency words.',
 '2 fly swatters;Sight word cards (or words written on the board);Tape',
 'Post 10–15 sight words on the board.|Two students stand ready with swatters.|Say a word (or use it in a sentence). The first to swat it reads it aloud for a point.|Rotate players quickly so everyone gets a turn.|Finish by reading all the words together chorally.',
 'A great 5-minute warm-up. For small group, play on the table with word cards.',
 'Whole Group,Small Group,Brain Break');
L('literacy','Roll & Read Word Families',
 'Students roll a die and read a CVC word from that column, building decoding speed with word families.',
 'Roll & Read sheet (6 columns: -at, -an, -ig, -op, -ug, -et);Dice;Highlighters',
 'Model blending sounds: /c/ /a/ /t/ — cat!|A partner rolls the die and reads a word from the matching column.|If read correctly, they highlight it.|Keep playing until one column is completely highlighted.|Challenge: write a silly sentence using two of the words.',
 'Easy to differentiate — swap in blends, digraphs, or silent-e words.',
 'Centers,Small Group');
L('literacy','Story Map Sticky Notes',
 'After a read-aloud, students retell the story by placing sticky notes under Beginning, Middle, and End.',
 'Picture book;Chart paper with B / M / E columns;Sticky notes;Crayons or pencils',
 'Read the book aloud, stopping to predict.|Turn and talk: What happened first? Next? At the end?|Each student draws or writes one event on a sticky note.|Place the notes in the right column and retell the story together.|Add the characters and setting at the top.',
 'Supports RL.1.2 and RL.1.3. Follow up by letting students make their own mini-book retell.',
 'Whole Group');
L('literacy','Sound Boxes',
 'Students push a counter into a box for each sound they hear — powerful phonemic awareness and spelling practice.',
 'Elkonin box mats (3 and 4 boxes);Counters or mini erasers;Dry-erase markers',
 'Say a word slowly: "ship."|Students repeat it and push one counter per sound: /sh/ /i/ /p/.|Count it up: 3 sounds, but 4 letters!|Replace the counters with letters.|Read the word back together.',
 'Keep it short (5–8 minutes). Fantastic for intervention groups.',
 'Small Group,Hands-on');
L('literacy','How to Build a Snowman',
 'Sequencing writing with First, Next, Then, and Last — students write a how-to for building a snowman.',
 'Snowman picture cards;Four-flap writing paper;Crayons;Cotton balls (optional)',
 'Read a snowman book and talk about the steps.|Put the picture cards in order as a class.|Model a sentence for each transition word.|Students write and illustrate each step on their flaps.|Share with a partner and act out the steps.',
 'Swap the topic by season: How to Carve a Pumpkin, How to Plant a Seed, How to Make a Valentine.',
 'Winter,Whole Group');
L('literacy','Valentine Kindness Letters',
 'Students learn the parts of a friendly letter and write a kind valentine to a classmate or school helper.',
 'Heart stationery;Friendly letter anchor chart;Crayons & stickers;Envelopes',
 'Introduce the parts: date, greeting, body, closing, signature.|Brainstorm kind words and compliments together.|Draw names so everyone receives a letter.|Write and decorate the letters.|Deliver them to mailboxes on Valentine\'s Day.',

/* ================= Storage (IndexedDB w/ memory fallback) ================= */
const DB = {
  db:null, mem:null,
  open(){ return new Promise((res)=>{
    try{
      const r = indexedDB.open('lessonIdeaMagazine',1);
      r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('lessons')) d.createObjectStore('lessons',{keyPath:'id'}); if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'key'}); };
      r.onsuccess=()=>{ this.db=r.result; res(true); };
      r.onerror=()=>{ this.useMem(); res(false); };
      r.onblocked=()=>{ this.useMem(); res(false); };
    }catch(e){ this.useMem(); res(false); }
  });},
  useMem(){ this.mem={lessons:new Map(),meta:new Map()}; },
  tx(store,mode,fn){
    if(this.mem){ return Promise.resolve(fn(null,this.mem[store])); }
    return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const s=t.objectStore(store); let out; const r=fn(s); if(r&&'onsuccess' in r) r.onsuccess=()=>{out=r.result}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('aborted')); });
  },
  all(){ return this.tx('lessons','readonly',(s,m)=> m?[...m.values()]:s.getAll()); },
  put(l){ return this.tx('lessons','readwrite',(s,m)=> m?void m.set(l.id,structuredClone(l)):s.put(l)); },
  putMany(a){ return this.tx('lessons','readwrite',(s,m)=>{ a.forEach(l=> m?m.set(l.id,structuredClone(l)):s.put(l)); }); },
  del(id){ return this.tx('lessons','readwrite',(s,m)=> m?void m.delete(id):s.delete(id)); },
  getMeta(k){ return this.tx('meta','readonly',(s,m)=> m?{result:m.get(k)}:s.get(k)).then(r=> this.mem ? r.result : (r?r.value:undefined)); },
  setMeta(k,v){ return this.tx('meta','readwrite',(s,m)=> m?void m.set(k,v):s.put({key:k,value:v})); },
};

let lessons = [];            // all lessons (incl hidden)
let settings = {teacherName:'Mrs. Jones'};
let customTags = [];
const byId = id => lessons.find(l=>l.id===id);
const visible = () => lessons.filter(l=>!l.hidden);
function sortLessons(list, bySection){
  const secIdx = id => SECTIONS.findIndex(s=>s.id===id);
  return list.slice().sort((a,b)=>{
    if(bySection){ const d=secIdx(a.section)-secIdx(b.section); if(d) return d; }
    if(a.mine!==b.mine) return a.mine?-1:1;
    if(a.mine) return (b.created||0)-(a.created||0);
    return (a.order||0)-(b.order||0);
  });
}
function allTags(){
  const set = new Set([...DEFAULT_TAGS, ...customTags]);
  lessons.forEach(l=>(l.tags||[]).forEach(t=>set.add(t)));
  const extra=[...set].filter(t=>!DEFAULT_TAGS.includes(t)).sort((a,b)=>a.localeCompare(b));
  return [...DEFAULT_TAGS.filter(t=>set.has(t)), ...extra];
}
function normalizeLesson(l){
  return {
    id:String(l.id), section: SEC[l.section]? l.section : 'math',
    title:String(l.title||'Untitled idea').slice(0,200), summary:String(l.summary||''),
    materials:Array.isArray(l.materials)?l.materials.map(String).filter(Boolean):[], steps:Array.isArray(l.steps)?l.steps.map(String).filter(Boolean):[],
    notes:String(l.notes||''), tags:Array.isArray(l.tags)?[...new Set(l.tags.map(t=>String(t).trim()).filter(Boolean))]:[],
    fav:!!l.fav, photo:(typeof l.photo==='string' && l.photo.startsWith('data:image/'))?l.photo:null,
    mine:!!l.mine, starter:!!l.starter, hidden:!!l.hidden, edited:!!l.edited,
    order:+l.order||0, created:+l.created||0, updated:+l.updated||0,
  };
}

/* ================= Books ================= */
function makeBook(kind,key=''){
  const v=visible();

  } else if(kind==='tag' && key){
    const list=sortLessons(v.filter(l=>l.tags.includes(key)),true);
    b={title:'#'+key, style:{...SPECIAL.tag,color:tagColor(key)}, pages:[cover({kicker:'Tagged',title:key,tagline:'Every idea with this tag',doodle:'tag',style:{...SPECIAL.tag,color:tagColor(key),cd:shade(tagColor(key))}},list),...lessonPages(list),endFor({title:'The end of this tag!',text:'Add a tag to any lesson from its edit form.'})]};
    b.style.cd=shade(tagColor(key));

    const list=sortLessons(v.filter(l=>l.fav),true);
    b={title:'Favorites', style:SPECIAL.fav, pages:[cover({kicker:'My',title:'Favorites',tagline:list.length?'The best of the best!':'Tap the ☆ on any lesson to add it here',doodle:'fav',style:SPECIAL.fav},list),...lessonPages(list),endFor({title:'Collect more stars!',text:'Tap the star on any lesson to save it here.'})]};
  } else if(kind==='all'){
    const list=sortLessons(v,true);
    b={title:'All Ideas', style:SPECIAL.all, pages:[cover({kicker:'Every',title:'All Ideas',tagline:'Flip through everything',doodle:'all',style:SPECIAL.all},list),...lessonPages(list),endFor({})]};
  } else if(kind==='mine'){
    const list=sortLessons(v.filter(l=>l.mine),true);
    b={title:'My Ideas', style:SPECIAL.mine, pages:[cover({kicker:'Made by me',title:'My Ideas',tagline:list.length?'Lessons you added':'Tap + to add your first idea!',doodle:'mine',style:SPECIAL.mine},list),...lessonPages(list),endFor({})]};
  } else if(kind==='search' && key){
    const list=sortLessons(searchLessons(key),true);
    b={title:`“${key}”`, style:SPECIAL.search, pages:[cover({kicker:'Search',title:`“${key}”`,tagline:'Search results',doodle:'search',style:SPECIAL.search},list),...lessonPages(list),endFor({title:'End of results',text:'Try another search or add a new idea.'})]};
  } else {

}
function shade(hex,amt=.78){ const n=parseInt(hex.slice(1),16); const r=Math.round((n>>16&255)*amt),g=Math.round((n>>8&255)*amt),bb=Math.round((n&255)*amt); return '#'+((1<<24)|(r<<16)|(g<<8)|bb).toString(16).slice(1); }
function searchLessons(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  return visible().filter(l=>{ const hay=[l.title,l.summary,l.notes,...l.materials,...l.steps,...l.tags,SEC[l.section]?.name].join(' ').toLowerCase(); return terms.every(t=>hay.includes(t)); });
}
function buildViews(pages, spread){
  const views=[]; let i=0;
  while(i<pages.length){
    if(!spread){ views.push([i]); i++; continue; }
    if(pages[i].wide){ views.push([i]); i++; continue; }
    if(i+1<pages.length && !pages[i+1].wide){ views.push([i,i+1]); i+=2; }
    else { views.push([i,-1]); i++; }

/* ================= Flip engine ================= */
let flip=null, animating=false;
function halfOf(srcEl, side, extra){
  const W=bookEl.clientWidth, h=W/2;
  const d=document.createElement('div'); d.className=`half ${side==='L'?'hl':'hr'} ${extra||''}`;
  const inner=document.createElement('div'); inner.className='half-inner'; inner.style.width=W+'px'; inner.style.left=(side==='L'?0:-h)+'px';
  const c=srcEl.cloneNode(true); c.classList.remove('current','enter'); c.removeAttribute('data-vi'); inner.appendChild(c); d.appendChild(inner);
  const s=document.createElement('div'); s.className='shade'; d.appendChild(s);
  return {d,c,s};
}
function copyScroll(from,to){ const a=$$('.page-scroll',from), b=$$('.page-scroll',to); a.forEach((e,i)=>{ if(b[i]&&e.scrollTop) b[i].scrollTop=e.scrollTop; }); }
function startFlip(dir){
  if(flip||animating) return false;

  const nextEl=buildViewEl(t);

  const W=bookEl.clientWidth; wrap.style.perspective=Math.round(Math.max(1500,W*2.6))+'px';
  let uL,uR,front,back,flipper=document.createElement('div');
  if(dir>0){ uL=halfOf(curEl,'L'); uR=halfOf(nextEl,'R'); front=halfOf(curEl,'R','front'); back=halfOf(nextEl,'L','back'); flipper.className='flipper fr'; }
  else { uL=halfOf(nextEl,'L'); uR=halfOf(curEl,'R'); front=halfOf(curEl,'L','front'); back=halfOf(nextEl,'R','back'); flipper.className='flipper fl'; }
  flipper.appendChild(front.d); flipper.appendChild(back.d);
  wrap.appendChild(uL.d); wrap.appendChild(uR.d); wrap.appendChild(flipper);
  bookEl.appendChild(wrap);
  [uL,uR,front,back].forEach(x=>{ if(x.c && (x===uL&&dir>0 || x===uR&&dir<0 || x===front)) copyScroll(curEl,x.c); });
  curEl.style.visibility='hidden';
  // shading gradients
  const revealed = dir>0? uR : uL, covered = dir>0? uL : uR;

  covered.s.style.background = dir>0? 'linear-gradient(270deg,rgba(0,0,0,.45),rgba(0,0,0,.08))' : 'linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.08))';
  front.s.style.background = dir>0? 'linear-gradient(90deg,rgba(0,0,0,.08),rgba(0,0,0,.5))' : 'linear-gradient(270deg,rgba(0,0,0,.08),rgba(0,0,0,.5))';
  back.s.style.background = dir>0? 'linear-gradient(270deg,rgba(0,0,0,.08),rgba(0,0,0,.5))' : 'linear-gradient(90deg,rgba(0,0,0,.08),rgba(0,0,0,.5))';
  // glossy highlight on the moving page
  const gl=document.createElement('div'); gl.className='shade'; gl.style.background='linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35) 50%,rgba(255,255,255,0))'; front.d.appendChild(gl);
  front.d.style.boxShadow='none';

    back.s.style.opacity = showFront? 0 : ((180-a)/90)*0.85;
    revealed.s.style.opacity = (1-p)*0.9;

}
function finishFlip(complete){

const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- pointer / drag ---------- */
// Gesture tuning (px, ms). A quick small flick should commit; a slow drag released near the start cancels.
const GESTURE = {
  SLOP: 6,             // px of movement before we decide the axis
  AXIS_RATIO: 1.2,     // |dx| must beat |dy|*ratio to count as horizontal (keeps vertical scrolling safe)
  VEL_WINDOW: 100,     // ms of recent samples used for release velocity
  FLICK_VEL: 0.2,      // px/ms in the turn direction (20px in ~60-100ms) commits
  FLICK_MIN: 10,       // px of travel a flick needs (filters jitter)
  BACK_VEL: -0.2,      // fling back toward start faster than this cancels even past the distance threshold
  COMMIT_FRAC: 0.13,   // slow drags commit after 13% of the page width
  QUICK_MS: 220,       // a whole touch lasting <= this long...
  QUICK_MIN: 12,       // ...that travelled >= this many px commits (robust to jank / coalesced events)
};
let drag=null, suppressClick=false;
const now=e=>(e&&e.timeStamp)||performance.now();

  drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,t0:now(e),mode:null,samples:[[now(e),e.clientX]]}; suppressClick=false;

  const s=d.samples; if(s.length<2) return 0;

  let first=s[s.length-2];
  for(let i=s.length-2;i>=0;i--){ if(tRef-s[i][0]<=GESTURE.VEL_WINDOW) first=s[i]; else break; }
  if(tRef-last[0]>GESTURE.VEL_WINDOW) return 0; // finger stopped before lifting
  const dt=Math.max(8,last[0]-first[0]); return (last[1]-first[1])/dt;
}
function reachFor(){ const W=bookEl.clientWidth; return (cur.views[cur.vi].length===2||W>700) ? W*0.62 : W*0.78; }
window.addEventListener('pointermove',e=>{

    if(Math.abs(dx)<GESTURE.SLOP&&Math.abs(dy)<GESTURE.SLOP) return;
    if(Math.abs(dx)>Math.abs(dy)*GESTURE.AXIS_RATIO){
      const dir=dx<0?1:-1; drag.dir=dir; drag.mode=startFlip(dir)?'flip':'rubber';

    flip.setP((drag.dir>0?-dx:dx)/reachFor());

},{passive:false});
function endDrag(e,cancelled){

  if(!d.mode && !cancelled && Math.abs(dx)>=GESTURE.SLOP && Math.abs(dx)>Math.abs(dy)*GESTURE.AXIS_RATIO){
    const v=Math.abs(recentVelocity(d,now(e)));

    if(quick || v>=GESTURE.FLICK_VEL || Math.abs(dx)>=bookEl.clientWidth*GESTURE.COMMIT_FRAC){ suppressClick=true; go(dx<0?1:-1); }
    return;
  }
  if(d.mode==='flip'&&flip){

    const travel=d.dir>0?-dx:dx;                                   // px moved in the turn direction
    const v=recentVelocity(d,now(e))*(d.dir>0?-1:1);               // px/ms in the turn direction
    const quick = (now(e)-d.t0)<=GESTURE.QUICK_MS && travel>=GESTURE.QUICK_MIN && v>GESTURE.BACK_VEL;

}
window.addEventListener('pointerup',e=>endDrag(e,false));

bookEl.addEventListener('click',e=>{ if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick=false; } },true);

/* ---------- edge taps & actions ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){ handleAction(a.dataset.act,a,e); return; }
  if(bookEl.contains(e.target) && !e.target.closest('button,a,input,textarea,select,label,img')){
    const r=bookEl.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width;
    const zone = r.width<600? 0.16 : 0.12;
    if(x<zone) go(-1); else if(x>1-zone) go(1);
  }
});
document.addEventListener('keydown',e=>{
  if(anyModal()){ if(e.key==='Escape') closeTopModal(); return; }
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); go(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(-1); }
  else if(e.key==='Escape'||e.key==='Home'){ if(cur.book.kind!=='home') openBook('home'); }
});
async function handleAction(act,el){
  switch(act){
    case 'home': closeAllModals(); openBook('home'); break;
    case 'open-section': closeAllModals(); openBook('section',el.dataset.id); break;
    case 'open-tag': closeAllModals(); openBook('tag',el.dataset.tag); break;
    case 'open-fav': openBook('fav'); break;
    case 'open-all': openBook('all'); break;
    case 'open-mine': openBook('mine'); break;
    case 'next': go(1); break;
    case 'prev': go(-1); break;
    case 'fav': await toggleFav(el.dataset.id); break;
    case 'edit': openForm(byId(el.dataset.id)); break;
    case 'add': openForm(null, el.dataset.sec || (cur.book.kind==='section'?cur.book.key:null)); break;
    case 'search': openSearch(); break;
    case 'settings': openSettings(); break;
  }
}
async function toggleFav(id){
  const l=byId(id); if(!l) return; l.fav=!l.fav; l.updated=Date.now();
  await DB.put(l); refreshView(); toast(l.fav?'⭐ Added to Favorites':'Removed from Favorites');
}

/* ---------- resize ---------- */
let rzT=0;
function onResize(){ clearTimeout(rzT); rzT=setTimeout(()=>{ if(!cur.book) return; cancelFlip(); const pi=firstPageOfView(cur.vi); const sp=isSpread(); if(sp!==cur.spread){ cur.spread=sp; cur.views=buildViews(cur.book.pages,sp); cur.vi=viewIndexForPage(pi); refreshView(); } },120); }
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

/* ================= Modals ================= */
const modalStack=[];
function anyModal(){ return modalStack.length>0; }
function openModal(html,{small=false,style='',onClose}={}){
  const wrap=document.createElement('div'); wrap.className='modal-wrap'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true');
  wrap.innerHTML=`<div class="msheet${small?' small':''}" style="${style}">${html}</div>`;
  document.body.appendChild(wrap); modalStack.push({wrap,onClose});
  wrap.addEventListener('click',e=>{ if(e.target===wrap) closeModal(wrap); if(e.target.closest('[data-close]')) closeModal(wrap); });
  return wrap;
}
function closeModal(wrap,result){
  const i=modalStack.findIndex(m=>m.wrap===wrap); if(i<0) return; const m=modalStack.splice(i,1)[0];
  wrap.classList.add('closing'); setTimeout(()=>wrap.remove(),170); m.onClose&&m.onClose(result);
}
function closeTopModal(){ const m=modalStack[modalStack.length-1]; if(m) closeModal(m.wrap); }
function closeAllModals(){ while(modalStack.length) closeTopModal(); }
function confirmBox(msg,{ok='OK',danger=true,title='Are you sure?'}={}){
  return new Promise(res=>{
    let val=false;
    const w=openModal(`<div class="mhead" style="background:${danger?'#F2545B':'#3D8BF2'}"><h2>${esc(title)}</h2></div><div class="mbody"><p class="confirm-msg">${esc(msg)}</p></div><div class="mfoot"><span class="sp"></span><button class="btn ghost" data-close>Cancel</button><button class="btn ${danger?'danger':'blue'}" data-ok>${esc(ok)}</button></div>`,{small:true,onClose:()=>res(val)});
    $('[data-ok]',w).addEventListener('click',()=>{ val=true; closeModal(w); });
  });
}
let toastT=0;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- Lesson form ---------- */
function openForm(lesson, presetSec){
  const isNew=!lesson;
  const l = lesson? structuredClone(lesson) : {section:presetSec||'math',title:'',summary:'',materials:[],steps:[],notes:'',tags:[],fav:false,photo:null};
  const tagsSel=new Set(l.tags); let photo=l.photo||null;
  const s0=SEC[l.section]||SECTIONS[0];
  const secOpts=SECTIONS.map(s=>`<label class="secopt" style="--sc:${s.color};--st:${s.tint};--so:${s.on}"><input type="radio" name="sec" value="${s.id}" ${s.id===l.section?'checked':''}><span><i>${DOODLE[s.id]}</i>${esc(s.short||s.name)}</span></label>`).join('');
  const html=`<div class="mhead"><h2>${isNew?ICON.pencil:ICON.pencil} ${isNew?'New lesson idea':'Edit lesson'}</h2><button class="x" data-close aria-label="Close">${ICON.x}</button></div>
  <form class="mbody" id="lessonForm" autocomplete="off" novalidate>
    <div class="fld" id="fTitle"><label for="fi-title">Title</label><input class="inp" id="fi-title" name="title" maxlength="140" placeholder="e.g. Apple Tasting Graph" value="${esc(l.title)}"><div class="err">Please give your idea a title 🙂</div></div>
    <div class="fld"><div class="lbl">Section</div><div class="secs">${secOpts}</div></div>
    <div class="fld"><label for="fi-sum">Kid-friendly summary <span class="hint">What's the big idea?</span></label><textarea class="inp short" id="fi-sum" name="summary" placeholder="Students taste red, green & yellow apples and graph their favorite.">${esc(l.summary)}</textarea></div>
    <div class="fld"><label for="fi-mat">Materials <span class="hint">one per line</span></label><textarea class="inp" id="fi-mat" name="materials" placeholder="Apples (red, green, yellow)&#10;Plates&#10;Graph chart">${esc(l.materials.join('\n'))}</textarea></div>
    <div class="fld"><label for="fi-steps">Steps <span class="hint">one per line</span></label><textarea class="inp" id="fi-steps" name="steps" placeholder="Slice the apples&#10;Taste each color&#10;Vote with sticky notes">${esc(l.steps.join('\n'))}</textarea></div>
    <div class="fld"><label for="fi-notes">Notes <span class="hint">optional</span></label><textarea class="inp short" id="fi-notes" name="notes" placeholder="Tips, standards, what to do differently next time…">${esc(l.notes)}</textarea></div>
    <div class="fld"><div class="lbl">Tags <span class="hint">tap to choose</span></div><div class="tagpick" id="tagPick"></div>
      <div class="newtag"><input class="inp" id="fi-newtag" maxlength="30" placeholder="Make a new tag…" enterkeyhint="done"><button type="button" class="btn ghost" id="addTagBtn">${ICON.plus} Add</button></div></div>
    <div class="fld"><div class="lbl">Photo <span class="hint">optional</span></div><div id="photoBox"></div><input type="file" accept="image/*" id="fi-photo" hidden></div>
    <div class="fld"><button type="button" class="favrow" id="favRow" aria-pressed="${!!l.fav}"></button></div>
  </form>
  <div class="mfoot">${!isNew&&l.mine?`<button class="btn danger" id="delBtn">${ICON.trash} Delete</button>`:''}${!isNew&&l.starter?`<button class="btn danger" id="hideBtn">${ICON.eyeOff} Hide</button>${l.edited?`<button class="btn ghost" id="resetBtn">${ICON.undo} Reset</button>`:''}`:''}<span class="sp"></span><button class="btn ghost" data-close>Cancel</button><button class="btn primary" id="saveBtn">${ICON.check} Save</button></div>`;
  const w=openModal(html,{style:secVars(s0)});
  const sheet=$('.msheet',w), form=$('#lessonForm',w);
  form.addEventListener('submit',e=>e.preventDefault());
  $$('input[name=sec]',w).forEach(r=>r.addEventListener('change',()=>{ const s=SEC[r.value]; sheet.setAttribute('style',secVars(s)); }));
  const drawTags=()=>{ const all=[...new Set([...allTags(),...tagsSel])]; $('#tagPick',w).innerHTML=all.map(t=>`<button type="button" class="chip" style="--tc:${tagColor(t)}" data-t="${esc(t)}" aria-pressed="${tagsSel.has(t)}"><span class="hash">#</span>${esc(t)}</button>`).join(''); };
  drawTags();
  $('#tagPick',w).addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(!b) return; const t=b.dataset.t; tagsSel.has(t)?tagsSel.delete(t):tagsSel.add(t); b.setAttribute('aria-pressed',tagsSel.has(t)); });
  const addTag=()=>{ const inp=$('#fi-newtag',w); let t=inp.value.trim().replace(/^#+/,'').replace(/\s+/g,' '); if(!t) return; const ex=allTags().find(x=>x.toLowerCase()===t.toLowerCase()); if(ex) t=ex; tagsSel.add(t); if(!ex && !customTags.includes(t)){ customTags.push(t); DB.setMeta('customTags',customTags); } inp.value=''; drawTags(); };
  $('#addTagBtn',w).addEventListener('click',addTag);
  $('#fi-newtag',w).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addTag(); } });
  const drawPhoto=()=>{ $('#photoBox',w).innerHTML = photo? `<div class="photo-prev"><img src="${photo}" alt="Lesson photo"><button type="button" class="btn danger rm" id="rmPhoto">${ICON.trash}</button></div>` : `<button type="button" class="photo-drop" id="pickPhoto">${ICON.camera}<span>Add a photo</span></button>`;
    const pp=$('#pickPhoto',w); if(pp) pp.onclick=()=>$('#fi-photo',w).click(); const rm=$('#rmPhoto',w); if(rm) rm.onclick=()=>{ photo=null; drawPhoto(); }; };
  drawPhoto();
  $('#fi-photo',w).addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; try{ $('#photoBox',w).innerHTML='<div class="empty">Shrinking photo…</div>'; photo=await compressImage(f); }catch(err){ toast('Sorry, that photo could not be read'); } drawPhoto(); e.target.value=''; });
  let fav=!!l.fav; const drawFav=()=>{ const b=$('#favRow',w); b.setAttribute('aria-pressed',fav); b.innerHTML=`${fav?ICON.starOn:ICON.starOff}<span>${fav?'In my Favorites':'Add to Favorites'}</span>`; };
  drawFav(); $('#favRow',w).addEventListener('click',()=>{ fav=!fav; drawFav(); });
  const lines=v=>v.split('\n').map(s=>s.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,'').trim()).filter(Boolean);
  $('#saveBtn',w).addEventListener('click',async()=>{
    const title=$('#fi-title',w).value.trim();
    if(!title){ $('#fTitle',w).classList.add('bad'); $('#fi-title',w).focus(); return; }
    const now=Date.now();
    const data={ title, section:$('input[name=sec]:checked',w).value, summary:$('#fi-sum',w).value.trim(), materials:lines($('#fi-mat',w).value), steps:lines($('#fi-steps',w).value), notes:$('#fi-notes',w).value.trim(), tags:[...tagsSel], photo, fav, updated:now };
    let rec;
    if(isNew){ rec=normalizeLesson({id:uid(),mine:true,starter:false,created:now,...data}); lessons.push(rec); }
    else { rec=byId(lesson.id); Object.assign(rec,data); if(rec.starter) rec.edited=true; }
    try{ await DB.put(rec); }catch(err){ toast('Could not save — storage may be full'); return; }
    closeModal(w); afterChange(rec.id, isNew); toast(isNew?'✨ Idea added!':'Saved!');
  });
  const del=$('#delBtn',w); if(del) del.addEventListener('click',async()=>{ if(!await confirmBox(`Delete “${lesson.title}”? This can't be undone.`,{ok:'Delete'})) return; await DB.del(lesson.id); lessons=lessons.filter(x=>x.id!==lesson.id); closeModal(w); rebuildBook(); toast('Deleted'); });
  const hide=$('#hideBtn',w); if(hide) hide.addEventListener('click',async()=>{ if(!await confirmBox(`Hide the starter idea “${lesson.title}”? You can bring it back any time in Settings.`,{ok:'Hide',title:'Hide this idea?'})) return; const r=byId(lesson.id); r.hidden=true; await DB.put(r); closeModal(w); rebuildBook(); toast('Hidden — restore it in Settings'); });
  const reset=$('#resetBtn',w); if(reset) reset.addEventListener('click',async()=>{ if(!await confirmBox('Put this starter idea back the way it came? Your changes will be lost.',{ok:'Reset',title:'Reset to original?'})) return; const orig=STARTERS.find(s=>s.id===lesson.id); if(!orig) return; const r=byId(lesson.id); Object.assign(r,structuredClone(orig),{fav:r.fav,edited:false,photo:null,updated:Date.now()}); await DB.put(r); closeModal(w); rebuildBook(r.id); toast('Reset to original'); });
  if(isNew) setTimeout(()=>{ if(matchMedia('(pointer:fine)').matches) $('#fi-title',w).focus(); },60);
}
function afterChange(id,isNew){
  const inBook = cur.book.pages.some(p=>p.t==='lesson'&&p.id===id);
  const l=byId(id);
  if(inBook || (!isNew && cur.book.kind!=='home')){
    const fresh=makeBook(cur.book.kind,cur.book.key);
    if(fresh.pages.some(p=>p.t==='lesson'&&p.id===id)){ rebuildBook(id); return; }
    if(!isNew){ rebuildBook(); return; }
  }
  const b=makeBook('section',l.section); const pi=b.pages.findIndex(p=>p.t==='lesson'&&p.id===id);
  openBook('section',l.section,Math.max(0,pi));
}
function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ try{ const max=1280; const w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s)); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.74)); }catch(e){ rej(e); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}

/* ---------- Search ---------- */
function openSearch(){
  const w=openModal(`<div class="mhead"><h2>${ICON.search} Find an idea</h2><button class="x" data-close aria-label="Close">${ICON.x}</button></div>
    <div class="mbody"><div class="search-in">${ICON.search}<input class="inp" id="q" type="search" placeholder="Try “pumpkin”, “graph”, or “dice”" enterkeyhint="search"></div>
    <div class="fld" style="margin:16px 0 0"><div class="lbl">Or tap a tag</div><div class="tagpick">${allTags().map(t=>tagChip(t)).join('')}</div></div>
    <div id="results"></div></div>`,{style:secVars(SPECIAL.search)});
  const q=$('#q',w), out=$('#results',w);
  const draw=()=>{ const v=q.value.trim(); if(!v){ out.innerHTML=''; return; } const r=sortLessons(searchLessons(v),true);
    out.innerHTML = r.length? `<div class="res-list"><button class="btn blue" data-sflip style="align-self:flex-start">${ICON.hand} Flip through ${plural(r.length,'result')}</button>${r.map(l=>{const s=SEC[l.section]; return `<button class="res" style="--rc:${s.cd}" data-goto="${esc(l.id)}"><span class="bar" style="background:${s.color}"></span><span><div class="t">${esc(l.title)}</div><div class="s">${esc(l.summary)}</div><div class="m">${esc(s.name)}${l.mine?' · My idea':''}</div></span></button>`;}).join('')}</div>` : `<div class="empty">No ideas match “${esc(v)}” yet.</div>`; };
  q.addEventListener('input',draw);
  q.addEventListener('keydown',e=>{ if(e.key==='Enter'&&q.value.trim()){ closeModal(w); openBook('search',q.value.trim()); } });
  out.addEventListener('click',e=>{ const g=e.target.closest('[data-goto]'); const v=q.value.trim(); if(g){ closeModal(w); const b=makeBook('search',v); const pi=b.pages.findIndex(p=>p.t==='lesson'&&p.id===g.dataset.goto); openBook('search',v,Math.max(0,pi)); } else if(e.target.closest('[data-sflip]')){ closeModal(w); openBook('search',v); } });
  setTimeout(()=>q.focus(),80);
}

/* ---------- Settings / backup ---------- */
async function openSettings(){
  const hidden=lessons.filter(l=>l.hidden);
  let persisted=null, est=null;
  try{ if(navigator.storage&&navigator.storage.persisted) persisted=await navigator.storage.persisted(); if(navigator.storage&&navigator.storage.estimate) est=await navigator.storage.estimate(); }catch(e){}
  const lastBk=await DB.getMeta('lastBackup');
  const used = est&&est.usage? (est.usage/1048576).toFixed(1)+' MB used' : '';
  const w=openModal(`<div class="mhead"><h2>${ICON.gear} Settings & Backup</h2><button class="x" data-close aria-label="Close">${ICON.x}</button></div>
  <div class="mbody">
    <div class="set-sec"><h3>✏️ Magazine name</h3><div class="namefix"><input class="inp" id="tname" maxlength="40" value="${esc(settings.teacherName||'')}" placeholder="Mrs. Jones"><span style="font-size:17px">'s Lesson Idea Magazine</span></div></div>
    <div class="set-sec"><h3>💾 Backup</h3><p>Your ideas and photos live only on this device. Export a backup file now and then (save it to Files, iCloud Drive, or email it to yourself). ${lastBk?`<br>Last backup: <b>${new Date(lastBk).toLocaleDateString()}</b>`:'<br><b>No backup yet.</b>'}</p>
      <div class="row"><button class="btn primary" id="expBtn">${ICON.download} Export backup</button><button class="btn ghost" id="impBtn">${ICON.upload} Import backup</button><input type="file" id="impFile" accept="application/json,.json" hidden></div></div>
    <div class="set-sec"><h3>📦 Storage</h3><p>${persisted===true?'✅ This device has agreed to keep your ideas safe (persistent storage is on).':persisted===false?'Storage is “best effort.” Adding this app to your Home Screen helps keep it safe — and exporting backups is always a good idea.':'Storage status unavailable.'} ${used?'('+used+')':''}</p>
      ${persisted===false?`<div class="row"><button class="btn ghost" id="persistBtn">Ask to keep my data safe</button></div>`:''}</div>
    <div class="set-sec"><h3>🙈 Hidden starter ideas (${hidden.length})</h3>${hidden.length? hidden.map(l=>`<div class="hid-item"><span class="t">${esc(l.title)} <span style="color:${SEC[l.section].cd};font-size:14px">· ${esc(SEC[l.section].name)}</span></span><button class="btn ghost" data-unhide="${esc(l.id)}">Show again</button></div>`).join('') : '<p>None — every starter idea is showing.</p>'}</div>
  </div><div class="mfoot"><span class="sp"></span><button class="btn blue" data-close>Done</button></div>`,{style:secVars(SPECIAL.mine)});
  const tn=$('#tname',w); tn.addEventListener('change',async()=>{ settings.teacherName=tn.value.trim()||'My'; await DB.setMeta('settings',settings); if(cur.book.kind==='home') refreshView(); else updateChrome(); });
  $('#expBtn',w).addEventListener('click',exportBackup);
  $('#impBtn',w).addEventListener('click',()=>$('#impFile',w).click());
  $('#impFile',w).addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(f){ const ok=await importBackup(f); if(ok) closeModal(w); } });
  const pb=$('#persistBtn',w); if(pb) pb.addEventListener('click',async()=>{ const r=await requestPersist(); toast(r?'✅ Storage will be kept':'Your browser said “not yet” — keep exporting backups'); });
  w.addEventListener('click',async e=>{ const u=e.target.closest('[data-unhide]'); if(!u) return; const l=byId(u.dataset.unhide); l.hidden=false; await DB.put(l); u.closest('.hid-item').remove(); rebuildBook(); toast('Showing again'); });
}
async function exportBackup(){
  const data={app:'lesson-idea-magazine',version:1,exportedAt:new Date().toISOString(),settings,customTags,lessons};
  const json=JSON.stringify(data); const d=new Date(); const name=`lesson-ideas-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const blob=new Blob([json],{type:'application/json'});
  let shared=false;
  try{ const touch=matchMedia('(pointer:coarse)').matches; if(touch && navigator.canShare && window.File){ const file=new File([blob],name,{type:'application/json'}); if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Lesson Ideas Backup'}); shared=true; } } }catch(e){ if(e&&e.name==='AbortError') return; }
  if(!shared){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
  await DB.setMeta('lastBackup',Date.now()); toast(`Backup saved (${plural(lessons.length,'idea')})`);
}
async function importBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ toast('That file is not a valid backup'); return false; }
  const list = Array.isArray(data)? data : data&&Array.isArray(data.lessons)? data.lessons : null;
  if(!list){ toast('That file is not a lesson backup'); return false; }
  const clean=list.filter(l=>l&&l.id&&l.title).map(normalizeLesson);
  if(!await confirmBox(`Import ${plural(clean.length,'idea')}? Ideas already here with the same ID will be replaced by the backup copy. Nothing else is removed.`,{ok:'Import',danger:false,title:'Import backup'})) return false;
  await DB.putMany(clean);
  if(data.customTags&&Array.isArray(data.customTags)){ customTags=[...new Set([...customTags,...data.customTags.map(String)])]; await DB.setMeta('customTags',customTags); }
  if(data.settings&&data.settings.teacherName&&(!settings.teacherName||settings.teacherName==='Mrs. Jones')){ settings.teacherName=String(data.settings.teacherName).slice(0,40); await DB.setMeta('settings',settings); }
  lessons=(await DB.all()).map(normalizeLesson);
  rebuildBook(); toast(`Imported ${plural(clean.length,'idea')} 🎉`); return true;
}
async function requestPersist(){ try{ if(navigator.storage&&navigator.storage.persist){ return await navigator.storage.persist(); } }catch(e){} return false; }

/* ================= Boot ================= */
async function boot(){
  await DB.open();
  if(DB.mem) setTimeout(()=>toast('Private mode: ideas will not be saved after closing'),800);
  const seeded=await DB.getMeta('seedVersion');
  if(!seeded){ await DB.putMany(STARTERS.map(s=>structuredClone(s))); await DB.setMeta('seedVersion',SEED_VERSION); }
  else if(seeded<SEED_VERSION){ const have=new Set((await DB.all()).map(l=>l.id)); await DB.putMany(STARTERS.filter(s=>!have.has(s.id)).map(s=>structuredClone(s))); await DB.setMeta('seedVersion',SEED_VERSION); }
  lessons=(await DB.all()).map(normalizeLesson);
  settings=Object.assign({teacherName:'Mrs. Jones'},await DB.getMeta('settings')||{});
  customTags=(await DB.getMeta('customTags'))||[];
  $('#loading')?.remove();
  const r=readHash(); cur.book=null;
  openBook(r.kind,r.key,r.page,{push:false,anim:true});
  try{ history.replaceState(null,'',hashFor()); }catch(e){}
  requestPersist();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
window.__lm={GESTURE,go,startFlip,get flip(){return flip},finishFlip,openBook,cur};
boot();

})();
